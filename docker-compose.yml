version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: prospex_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospex}
      POSTGRES_DB: ${POSTGRES_DB:-prospex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prospex_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-prospexredis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-prospexredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prospex_api
    restart: always
    env_file:
      - .env
    command: sh -c "cd /app && pnpm --filter @prospex/database db:deploy && cd /app/apps/api && node dist/main"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospex}:${POSTGRES_PASSWORD:-prospex}@postgres:5432/${POSTGRES_DB:-prospex}
      REDIS_URL: redis://:${REDIS_PASSWORD:-prospexredis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-DD12E2C43D9CD70FC98583AB87721BB024339BFCA9909D2B6C969332A3462672}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-nwx1O+P5OW4//g9ayoCMn/oAkfFyw6y4AttgpKQm4og=}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      PORT: 3001
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://prospex.aybisa-workspace.my.id}
      TWENTY_CRM_URL: ${TWENTY_CRM_URL:-http://192.168.1.125:3020}
      TWENTY_CRM_API_KEY: ${TWENTY_CRM_API_KEY:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://wa.aybisa-workspace.my.id}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-waha}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-prospex123}
      WHATSAPP_SESSION: ${WHATSAPP_SESSION:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - cloudflare-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-/api}
    container_name: prospex_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: prospex_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - default
      - cloudflare-net
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=prospex.aybisa-workspace.my.id"
      - "dockflare.service=http://prospex_nginx:80"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  cloudflare-net:
    external: true
